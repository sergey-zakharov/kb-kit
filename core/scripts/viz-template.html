<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb graph</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#14161c; color:#d7dae2; font:13px/1.45 system-ui, sans-serif; overflow:hidden; }
  #c { display:block; cursor:grab; }
  #hud { position:fixed; top:10px; left:10px; background:#1d2029cc; border:1px solid #2c3140;
         border-radius:8px; padding:10px 12px; max-width:300px; backdrop-filter:blur(4px); }
  #hud h1 { font-size:14px; margin-bottom:4px; }
  #hud .meta { color:#8a90a0; font-size:12px; }
  #q { width:100%; margin-top:8px; padding:5px 8px; border-radius:6px; border:1px solid #2c3140;
       background:#14161c; color:#d7dae2; outline:none; }
  #legend { margin-top:8px; display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; }
  #legend span { display:inline-flex; align-items:center; gap:4px; color:#aab0c0; }
  #legend i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  #detail { position:fixed; bottom:10px; left:10px; background:#1d2029cc; border:1px solid #2c3140;
            border-radius:8px; padding:10px 12px; max-width:340px; display:none; }
  #detail b { font-size:13px; }
  #detail .d { color:#aab0c0; margin-top:3px; }
  #detail .f { color:#e8a04c; margin-top:3px; }
  #hint { position:fixed; bottom:10px; right:12px; color:#5a6072; font-size:11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>kb graph</h1>
  <div class="meta" id="counts"></div>
  <input id="q" type="search" placeholder="search nodes…">
  <div id="legend"></div>
</div>
<div id="detail"></div>
<div id="hint">drag: pan · wheel: zoom · click: neighbors · esc: clear</div>
<script>
const DATA = /*__KB_GRAPH_DATA__*/ {"nodes":[],"edges":[]};
const PALETTE = ["#5b9bd5","#70ad47","#e8a04c","#c65b8a","#8f7ee6","#4cbfbf","#d5715b","#a0a84c"];
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, dpr = window.devicePixelRatio || 1;
function resize(){ W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+"px"; cv.style.height = H+"px"; ctx.setTransform(dpr,0,0,dpr,0,0); }
resize(); addEventListener("resize", () => { resize(); draw(); });

const nodes = DATA.nodes, edges = DATA.edges.filter(e => !e.broken);
const brokenEdges = DATA.edges.filter(e => e.broken);
const byId = {}; nodes.forEach(n => byId[n.id] = n);
const themes = [...new Set(nodes.map(n => n.theme || "(root)"))].sort();
const color = t => PALETTE[themes.indexOf(t) % PALETTE.length];
const deg = {}; edges.forEach(e => { deg[e.from]=(deg[e.from]||0)+1; deg[e.to]=(deg[e.to]||0)+1; });

// deterministic-ish initial layout on a circle per theme
nodes.forEach((n,i) => {
  const a = (i/nodes.length)*Math.PI*2 + themes.indexOf(n.theme||"(root)");
  n.x = Math.cos(a)*(120+ (i%5)*30); n.y = Math.sin(a)*(120+(i%7)*24); n.vx = 0; n.vy = 0;
});
const springs = edges.map(e => [byId[e.from], byId[e.to]]).filter(p => p[0] && p[1]);

let alpha = 1;
function tick(){
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
    const a=nodes[i], b=nodes[j];
    let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy || 1, d=Math.sqrt(d2);
    const rep = 2600/d2;
    dx/=d; dy/=d;
    a.vx -= dx*rep; a.vy -= dy*rep; b.vx += dx*rep; b.vy += dy*rep;
  }
  springs.forEach(([a,b]) => {
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    const f = (d-90)*0.02; dx/=d; dy/=d;
    a.vx += dx*f; a.vy += dy*f; b.vx -= dx*f; b.vy -= dy*f;
  });
  nodes.forEach(n => {
    n.vx -= n.x*0.003; n.vy -= n.y*0.003;           // gravity to center
    n.x += n.vx*alpha; n.y += n.vy*alpha; n.vx*=0.85; n.vy*=0.85;
  });
  alpha = Math.max(alpha*0.985, 0.02);
}

let scale = 1.6, ox = 0, oy = 0;                     // view transform
let hover = null, selected = null, query = "";
const sx = n => W/2 + (n.x+ox)*scale, sy = n => H/2 + (n.y+oy)*scale;
const r = n => 6 + Math.min(10, (deg[n.id]||0)*1.4);

function visible(n){
  if (query && !(n.id+" "+(n.description||"")).toLowerCase().includes(query)) return false;
  return true;
}
function neighbor(n){
  if (!selected) return true;
  if (n === selected) return true;
  return springs.some(([a,b]) => (a===selected&&b===n)||(b===selected&&a===n));
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.lineWidth = 1;
  brokenEdges.forEach(e => {
    const a = byId[e.from]; if (!a) return;
    ctx.strokeStyle = "#a04c4c88"; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(sx(a), sy(a)); ctx.lineTo(sx(a)+18, sy(a)-18); ctx.stroke(); ctx.setLineDash([]);
  });
  springs.forEach(([a,b]) => {
    const on = (!selected || a===selected || b===selected) && visible(a) && visible(b);
    ctx.strokeStyle = on ? "#3c4356" : "#3c435633";
    ctx.beginPath(); ctx.moveTo(sx(a),sy(a)); ctx.lineTo(sx(b),sy(b)); ctx.stroke();
  });
  nodes.forEach(n => {
    const dim = !visible(n) || !neighbor(n);
    const c = color(n.theme || "(root)");
    ctx.globalAlpha = dim ? 0.18 : 1;
    ctx.beginPath(); ctx.arc(sx(n), sy(n), r(n), 0, Math.PI*2);
    if (n.adopted){ ctx.strokeStyle = c; ctx.setLineDash([3,3]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); }
    else { ctx.fillStyle = c; ctx.fill(); }
    if (n.flags && Object.keys(n.flags).length){
      ctx.strokeStyle = "#e8a04c"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx(n), sy(n), r(n)+3, 0, Math.PI*2); ctx.stroke();
    }
    if (!dim && (scale > 1.1 || n===hover || n===selected)){
      ctx.fillStyle = "#d7dae2"; ctx.font = "11px system-ui";
      ctx.fillText(n.id, sx(n)+r(n)+4, sy(n)+4);
    }
    ctx.globalAlpha = 1;
  });
}
function loop(){ if (alpha > 0.021){ tick(); } draw(); requestAnimationFrame(loop); }

function pick(mx,my){
  let best=null, bd=1e9;
  nodes.forEach(n => { const dx=sx(n)-mx, dy=sy(n)-my, d=dx*dx+dy*dy;
    if (d < Math.pow(r(n)+4,2) && d < bd){ best=n; bd=d; } });
  return best;
}
const detail = document.getElementById("detail");
function showDetail(n){
  if (!n){ detail.style.display="none"; return; }
  const flags = n.flags && Object.keys(n.flags).length
    ? `<div class="f">⚠ ${Object.entries(n.flags).map(([k,v])=>k+"="+v).join(", ")}</div>` : "";
  detail.innerHTML = `<b>${n.id}</b> <span class="d">· ${n.theme||"(root)"} · ${n.type||"adopted"}</span>
    <div class="d">${n.description||"(no description)"}</div>
    <div class="d">${n.file}</div>${flags}`;
  detail.style.display = "block";
}
let dragging = false, lx=0, ly=0;
cv.addEventListener("mousedown", e => { dragging=true; lx=e.clientX; ly=e.clientY; cv.style.cursor="grabbing"; });
addEventListener("mouseup", () => { dragging=false; cv.style.cursor="grab"; });
addEventListener("mousemove", e => {
  if (dragging){ ox += (e.clientX-lx)/scale; oy += (e.clientY-ly)/scale; lx=e.clientX; ly=e.clientY; draw(); return; }
  hover = pick(e.clientX, e.clientY); showDetail(hover || selected); draw();
});
cv.addEventListener("click", e => { selected = pick(e.clientX, e.clientY); showDetail(selected); draw(); });
addEventListener("keydown", e => { if (e.key === "Escape"){ selected=null; query=""; q.value=""; showDetail(null); draw(); } });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  scale *= e.deltaY < 0 ? 1.12 : 0.89; scale = Math.max(0.3, Math.min(6, scale)); draw();
}, { passive:false });
const q = document.getElementById("q");
q.addEventListener("input", () => { query = q.value.toLowerCase().trim(); draw(); });

const extCount = DATA.edges.filter(e => e.external && !e.broken).length;
document.getElementById("counts").textContent =
  `${nodes.length} nodes · ${edges.filter(e=>!e.external).length} links` +
  (extCount ? ` · ${extCount} → external bases (not drawn)` : "") +
  (brokenEdges.length ? ` · ${brokenEdges.length} broken` : "") +
  (nodes.some(n=>n.adopted) ? ` · dashed = adopted` : "");
document.getElementById("legend").innerHTML =
  themes.map(t => `<span><i style="background:${color(t)}"></i>${t}</span>`).join("");
loop();
</script>
</body>
</html>
