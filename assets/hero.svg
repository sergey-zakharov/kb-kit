<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="kb-kit — the constellation that wears a mask">
  <defs>
    <clipPath id="r"><rect width="1600" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1600" height="420" fill="#14161c"/>

    <!-- constellation: node positions trace a domino mask; you see it on the second glance -->
    <g stroke="#2c3140" stroke-width="2" fill="none">
      <path d="M235,175 L300,128"/>
      <path d="M300,128 L400,112"/>
      <path d="M400,112 L500,128"/>
      <path d="M500,128 L565,175"/>
      <path d="M235,175 L262,242"/>
      <path d="M262,242 L400,272"/>
      <path d="M400,272 L538,242"/>
      <path d="M538,242 L565,175"/>
      <path d="M330,196 L400,112"/>
      <path d="M330,196 L262,242"/>
      <path d="M470,196 L400,112"/>
      <path d="M470,196 L538,242"/>
      <path d="M330,196 L400,272"/>
      <path d="M470,196 L400,272"/>
      <!-- loose ends: the graph continues beyond the mask -->
      <path d="M235,175 L152,150"/>
      <path d="M565,175 L652,148"/>
      <path d="M652,148 L718,190"/>
      <path d="M152,150 L96,205"/>
    </g>
    <g>
      <circle cx="300" cy="128" r="9"  fill="#5b9bd5" opacity="0.75"/>
      <circle cx="400" cy="112" r="11" fill="#8f7ee6" opacity="0.75"/>
      <circle cx="500" cy="128" r="9"  fill="#70ad47" opacity="0.75"/>
      <circle cx="235" cy="175" r="8"  fill="#4cbfbf" opacity="0.75"/>
      <circle cx="565" cy="175" r="8"  fill="#c65b8a" opacity="0.75"/>
      <circle cx="262" cy="242" r="9"  fill="#70ad47" opacity="0.75"/>
      <circle cx="400" cy="272" r="10" fill="#5b9bd5" opacity="0.75"/>
      <circle cx="538" cy="242" r="9"  fill="#8f7ee6" opacity="0.75"/>
      <circle cx="152" cy="150" r="6"  fill="#3c4356"/>
      <circle cx="96"  cy="205" r="5"  fill="#3c4356"/>
      <circle cx="652" cy="148" r="6"  fill="#3c4356"/>
      <circle cx="718" cy="190" r="5"  fill="#3c4356"/>
      <!-- the eyes: the only full-strength accents on the canvas -->
      <circle cx="330" cy="196" r="15" fill="#e8a04c"/>
      <circle cx="470" cy="196" r="15" fill="#e8a04c"/>
    </g>

    <!-- wordmark: the hyphen IS a graph edge -->
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="950" y="212" font-size="112" font-weight="800" fill="#e8eaf0" letter-spacing="-3">kb</text>
      <g>
        <line x1="1102" y1="176" x2="1188" y2="176" stroke="#e8a04c" stroke-width="7"/>
        <circle cx="1102" cy="176" r="12" fill="#e8a04c"/>
        <circle cx="1188" cy="176" r="12" fill="#e8a04c"/>
      </g>
      <text x="1222" y="212" font-size="112" font-weight="800" fill="#e8eaf0" letter-spacing="-3">kit</text>
      <text x="954" y="272" font-size="27" fill="#aab0c0">A knowledge base your AI agent can actually maintain.</text>
      <text x="954" y="322" font-size="20" fill="#5a6072" font-family="ui-monospace, 'SF Mono', Consolas, monospace">just markdown · just git · masks included</text>
    </g>
  </g>
</svg>
