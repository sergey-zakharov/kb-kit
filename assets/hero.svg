<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="kb-kit — markdown files linked into an evidence graph">
  <defs>
    <clipPath id="r"><rect width="1600" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1600" height="420" fill="#14161c"/>

    <!-- evidence chain: decision → insight → source quote -->
    <!-- edges first (under cards) -->
    <g fill="none">
      <path d="M395,198 C455,192 472,152 520,122" stroke="#e8a04c" stroke-width="3"/>
      <path d="M400,318 C310,318 265,275 263,228" stroke="#e8a04c" stroke-width="3"/>
      <path d="M648,180 C660,230 660,250 645,262" stroke="#3c4356" stroke-width="2.5"/>
    </g>

    <!-- card: source (interview) -->
    <g>
      <rect x="520" y="60" width="256" height="120" rx="10" fill="#1d2029" stroke="#2c3140" stroke-width="1.5"/>
      <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="15">
        <text x="542" y="92"  fill="#5a6072">sources/interview.md</text>
        <text x="542" y="120" fill="#d7dae2">"I can't find anything"</text>
        <text x="542" y="148" fill="#5a6072">(12:40) <tspan fill="#e8a04c">^q1</tspan></text>
      </g>
    </g>

    <!-- card: insight -->
    <g>
      <rect x="140" y="96" width="255" height="130" rx="10" fill="#1d2029" stroke="#2c3140" stroke-width="1.5"/>
      <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="15">
        <text x="162" y="126" fill="#5a6072">insights/</text>
        <text x="162" y="152" fill="#aab0c0">name: cant-retrieve</text>
        <text x="162" y="178" fill="#aab0c0">Evidence:</text>
        <text x="186" y="204" fill="#e8a04c">[[interview#^q1]]</text>
      </g>
    </g>

    <!-- card: decision -->
    <g>
      <rect x="400" y="262" width="270" height="118" rx="10" fill="#1d2029" stroke="#2c3140" stroke-width="1.5"/>
      <g font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="15">
        <text x="422" y="294" fill="#5a6072">decisions/001-*.md</text>
        <text x="422" y="322" fill="#aab0c0">status: <tspan fill="#70ad47">active</tspan></text>
        <text x="422" y="350" fill="#aab0c0">why: <tspan fill="#e8a04c">[[cant-retrieve]]</tspan></text>
      </g>
    </g>

    <!-- ports on the edges -->
    <g fill="#e8a04c">
      <circle cx="395" cy="198" r="5.5"/>
      <circle cx="520" cy="122" r="5.5"/>
      <circle cx="400" cy="318" r="5.5"/>
      <circle cx="263" cy="228" r="5.5"/>
    </g>

    <!-- wordmark: the hyphen IS a graph edge -->
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="950" y="212" font-size="112" font-weight="800" fill="#e8eaf0" letter-spacing="-3">kb</text>
      <g>
        <line x1="1108" y1="176" x2="1186" y2="176" stroke="#e8a04c" stroke-width="7"/>
        <circle cx="1108" cy="176" r="12" fill="#e8a04c"/>
        <circle cx="1186" cy="176" r="12" fill="#e8a04c"/>
      </g>
      <text x="1222" y="212" font-size="112" font-weight="800" fill="#e8eaf0" letter-spacing="-3">kit</text>
      <text x="954" y="266" font-size="27" fill="#aab0c0">A knowledge base your AI agent</text>
      <text x="954" y="302" font-size="27" fill="#aab0c0">can actually maintain.</text>
      <text x="954" y="356" font-size="20" fill="#5a6072" font-family="ui-monospace, 'SF Mono', Consolas, monospace">just markdown · just git · masks included</text>
    </g>
  </g>
</svg>
