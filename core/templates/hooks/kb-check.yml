# kb-kit hygiene check for CI. The toolkit lives in-repo (.kb/) — no external deps.
# Install: copy to .github/workflows/kb-check.yml
name: kb-check
on:
  pull_request:
    paths: ['**/*.md']
  push:
    branches: [main]
    paths: ['**/*.md']
jobs:
  kb-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kb-check
        run: |
          chmod +x .kb/scripts/*.sh
          .kb/scripts/kb-check.sh
